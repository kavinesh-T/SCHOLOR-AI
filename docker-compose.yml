version: '3.8'

services:
  scholarmatch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scholarmatch_ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/scholarships.db:/app/backend/scholarships.db
